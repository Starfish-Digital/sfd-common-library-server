openapi: 3.0.0
info:
  title: Account-data-exp-api
  version: 1.0.0
servers:
- url: /
paths:
  /Secret:
    get:
      operationId: getSecretByName
      parameters:
      - description: Provide secretName
        example: kkhdh-sc
        explode: true
        in: query
        name: secretName
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseSecrets'
          description: Successfully retrieved the secret
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Get a secret by name
      tags:
      - secrets
      x-eov-operation-handler: controllers/SecretsController
  /certificate:
    get:
      operationId: getPublicKeyByKid
      parameters:
      - description: Provide kid
        example: hsbc-public.key
        explode: true
        in: query
        name: kid
        required: true
        schema:
          type: string
        style: form
      - description: s3/dev-certificates-bucket
        example: s3/dev-certificates-bucket
        explode: true
        in: query
        name: certificatePath
        required: true
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseKid'
          description: Successfully retrieved the public key
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Get public key by Key ID (kid)
      tags:
      - Certificates
      x-eov-operation-handler: controllers/CertificatesController
  /consents:
    get:
      operationId: getConsentById
      parameters:
      - description: Provide accountId
        example: SCBXX123
        explode: true
        in: query
        name: accountId
        required: false
        schema:
          type: string
        style: form
      - description: Provide bic
        example: HSBCSGSGXXX
        explode: true
        in: query
        name: bic
        required: false
        schema:
          type: string
        style: form
      - description: Provide consentId
        example: ""
        explode: true
        in: query
        name: consentId
        required: false
        schema:
          type: string
        style: form
      - description: Provide userUuid
        example: ""
        explode: true
        in: query
        name: userUuid
        required: false
        schema:
          type: string
        style: form
      - description: Provide institutionId
        example: hsbc-bank
        explode: true
        in: query
        name: institutionId
        required: false
        schema:
          type: string
        style: form
      - description: provide accountNumber
        example: 1234xxxx
        explode: true
        in: query
        name: accountNumber
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseConsents'
          description: Successfully retrieved the consent
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: "Get consets by accountId,bic,consentId,userUuid,institutionId and\
        \ accountNumber"
      tags:
      - Consents
      x-eov-operation-handler: controllers/ConsentsController
  /subscriptions:
    get:
      operationId: getSubscriptionBySubscriptionId
      parameters:
      - description: Provide subscriptionId
        example: HSBCSGS89470
        explode: true
        in: query
        name: subscriptionId
        required: false
        schema:
          type: string
        style: form
      - description: Provide consentId
        example: ""
        explode: true
        in: query
        name: consentId
        required: false
        schema:
          type: string
        style: form
      - description: Provide userUuid
        example: ""
        explode: true
        in: query
        name: userUuid
        required: false
        schema:
          type: string
        style: form
      - description: Provide institutionId
        example: hsbc-bank
        explode: true
        in: query
        name: institutionId
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseConsents'
          description: Successfully retrieved the subscription
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Get subscription data by subscriptionId and institutionId
      tags:
      - Subscriptions
      x-eov-operation-handler: controllers/SubscriptionsController
  /auth/refreshToken:
    post:
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/refreshTokenRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseAuthToken'
          description: Successfully refreshed token
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseUnauthorized'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Update the token using the refresh token
      tags:
      - Authentication
      x-eov-operation-handler: controllers/AuthenticationController
  /users:
    get:
      operationId: getUsersByUserUuid
      parameters:
      - description: Provide emailId
        example: test@gmail.com
        explode: true
        in: query
        name: emailId
        required: false
        schema:
          type: string
        style: form
      - description: Provide onboardingTpp
        example: khdfkh3644jk
        explode: true
        in: query
        name: onboardingTpp
        required: false
        schema:
          type: string
        style: form
      - description: Provide consentId
        example: ""
        explode: true
        in: query
        name: consentId
        required: false
        schema:
          type: string
        style: form
      - description: Provide userUuid
        example: ""
        explode: true
        in: query
        name: userUuid
        required: false
        schema:
          type: string
        style: form
      - description: Provide institutionId
        example: hsbc-bank
        explode: true
        in: query
        name: institutionId
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseUsers'
          description: Successfully retrieved the user by userUuid
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Get users by userUuid
      tags:
      - Users
      x-eov-operation-handler: controllers/UsersController
    put:
      operationId: updateUsersByUserUuid
      parameters:
      - description: Provide userUuid
        example: ""
        explode: true
        in: query
        name: userUuid
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/updateuserRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseUsers'
          description: Successfully retrieved the user by userUuid
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Not found
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Update users by userUuid
      tags:
      - Users
      x-eov-operation-handler: controllers/UsersController
  /Tpp:
    get:
      operationId: getOnboardingTPPByInstitutionId
      parameters:
      - description: Provide institutionId
        example: hsbc-bank
        explode: true
        in: query
        name: name
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseTpp'
          description: Successfully retrieved the onboarding TPP
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Get onboarding TPP by institutionId
      tags:
      - Tpp
      x-eov-operation-handler: controllers/TppController
  /encrypt:
    post:
      operationId: encryptData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/encryptRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseEncrypt'
          description: Successfully encrypted the data
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Bad request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Encrypt data using a specified encryption key
      tags:
      - Utility
      x-eov-operation-handler: controllers/UtilityController
  /decrypt:
    post:
      operationId: decryptData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/decryptRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseDecrypt'
          description: Successfully decrypted the data
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Bad request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Decrypt data using a specified encryption key
      tags:
      - Utility
      x-eov-operation-handler: controllers/UtilityController
  /compress:
    post:
      operationId: compressData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/compressRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseEncode'
          description: Successfully compressed the data
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Bad request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Compress data
      tags:
      - Utility
      x-eov-operation-handler: controllers/UtilityController
  /decompress:
    post:
      operationId: decompressData
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/decompressRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseDecode'
          description: Successfully decompressed the data
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Bad request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Decompress data
      tags:
      - Utility
      x-eov-operation-handler: controllers/UtilityController
  /checkJwtExpiry:
    post:
      operationId: checkJwtExpiry
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jwtRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseCheckJwtExpiry'
          description: Successfully checked the JWT token expiry
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Bad request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Check if a JWT token has expired
      tags:
      - Authentication
      x-eov-operation-handler: controllers/AuthenticationController
  /createHash:
    post:
      operationId: createHash
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/hashRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseHash'
          description: Successfully generated the hash of the payment data
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Bad request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: "Create a secure hash (e.g., SHA-256) of payment data"
      tags:
      - Utility
      x-eov-operation-handler: controllers/UtilityController
  /verifyJwt:
    post:
      operationId: verifyJwt
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/jwtVerifyRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseVerifyJwt'
          description: Successfully verified the JWT token
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Bad request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Verify a JWT token using a public key
      tags:
      - Authentication
      x-eov-operation-handler: controllers/AuthenticationController
  /Config:
    get:
      operationId: getInstitutionConfig
      parameters:
      - description: Provide targetEntity
        example: hsbc-bank
        explode: true
        in: query
        name: targetEntity
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseConfig'
          description: Successfully retrieved the institution configuration (schema
            table) for the given authorization URL
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: "Get institution configuration (schema table) by authorization URL,environmentType\
        \ and institutionId"
      tags:
      - Configuration
      x-eov-operation-handler: controllers/ConfigurationController
  /Config/validate:
    get:
      operationId: getInstitutionConfigByAuthorizationUrl
      parameters:
      - description: Provide authorizationUrl
        example: deutchbank@2345o5
        explode: true
        in: query
        name: authorizationUrl
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/successResponseConfig'
          description: Successfully retrieved the institution configuration (schema
            table) for the given authorization URL
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBadRequest'
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseNotFound'
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseForServerError'
          description: Server error
      summary: Get institution configuration (schema table) by authorization URL
      tags:
      - Configuration
      x-eov-operation-handler: controllers/ConfigurationController
components:
  parameters:
    correlationId:
      description: "**Required** for use when any client (except partners using SPIs)\
        \ invokes the payment initiation API. A unique identifier value for tracing\
        \ api calls. To be used as An identifier for service provider (Starfish Digital)\
        \ to \nreject duplicate payments"
      explode: false
      in: header
      name: x-correlation-Id
      required: true
      schema:
        pattern: "^[a-zA-Z0-9-_]+$"
        type: string
      style: simple
    userUuid:
      description: Provide userUuid
      example: ""
      explode: true
      in: query
      name: userUuid
      required: false
      schema:
        type: string
      style: form
    emailId:
      description: Provide emailId
      example: test@gmail.com
      explode: true
      in: query
      name: emailId
      required: false
      schema:
        type: string
      style: form
    onboardingTpp:
      description: Provide onboardingTpp
      example: khdfkh3644jk
      explode: true
      in: query
      name: onboardingTpp
      required: false
      schema:
        type: string
      style: form
    consentId:
      description: Provide consentId
      example: ""
      explode: true
      in: query
      name: consentId
      required: false
      schema:
        type: string
      style: form
    institutionId:
      description: Provide institutionId
      example: hsbc-bank
      explode: true
      in: query
      name: institutionId
      required: false
      schema:
        type: string
      style: form
    environmentType:
      description: Provide environmentType
      example: dev
      explode: true
      in: query
      name: environmentType
      required: false
      schema:
        type: string
      style: form
    accountId:
      description: Provide accountId
      example: SCBXX123
      explode: true
      in: query
      name: accountId
      required: false
      schema:
        type: string
      style: form
    bic:
      description: Provide bic
      example: HSBCSGSGXXX
      explode: true
      in: query
      name: bic
      required: false
      schema:
        type: string
      style: form
    authorizationUrl:
      description: Provide authorizationUrl
      example: deutchbank@2345o5
      explode: true
      in: query
      name: authorizationUrl
      required: false
      schema:
        type: string
      style: form
    secretName:
      description: Provide secretName
      example: kkhdh-sc
      explode: true
      in: query
      name: secretName
      required: true
      schema:
        type: string
      style: form
    subscriptionId:
      description: Provide subscriptionId
      example: HSBCSGS89470
      explode: true
      in: query
      name: subscriptionId
      required: false
      schema:
        type: string
      style: form
    kid:
      description: Provide kid
      example: hsbc-public.key
      explode: true
      in: query
      name: kid
      required: true
      schema:
        type: string
      style: form
    certificatePath:
      description: s3/dev-certificates-bucket
      example: s3/dev-certificates-bucket
      explode: false
      in: query
      name: certificatePath
      required: true
      schema:
        type: string
      style: form
    accountNumber:
      description: provide accountNumber
      example: 1234xxxx
      explode: true
      in: query
      name: accountNumber
      required: false
      schema:
        type: string
      style: form
  schemas:
    successResponseDecode:
      example:
        data:
        - inputStr: eyJhbGciOi...
        - inputStr: eyJhbGciOi...
        success: true
        meta:
          code: 200
          message: Compress successfully
      properties:
        success:
          example: true
          type: boolean
        meta:
          $ref: '#/components/schemas/successResponseDecode_meta'
        data:
          items:
            $ref: '#/components/schemas/successResponseDecode_data_inner'
          type: array
      type: object
    successResponseEncode:
      example:
        data:
        - inputStr: eyJhbGciOi...
        - inputStr: eyJhbGciOi...
        success: true
        meta:
          code: 200
          message: Compress successfully
      properties:
        success:
          example: true
          type: boolean
        meta:
          $ref: '#/components/schemas/successResponseDecode_meta'
        data:
          items:
            $ref: '#/components/schemas/successResponseDecode_data_inner'
          type: array
      type: object
    successResponseEncrypt:
      example:
        data:
        - encryptStr: eyJhbGciOi...
        - encryptStr: eyJhbGciOi...
        success: true
        meta:
          code: 200
          message: Compress successfully
      properties:
        success:
          example: true
          type: boolean
        meta:
          $ref: '#/components/schemas/successResponseDecode_meta'
        data:
          items:
            $ref: '#/components/schemas/successResponseEncrypt_data_inner'
          type: array
      type: object
    successResponseDecrypt:
      example:
        data:
        - DecryptStr: eyJhbGciOi...
        - DecryptStr: eyJhbGciOi...
        success: true
        meta:
          code: 200
          message: Decrypt successfully
      properties:
        success:
          example: true
          type: boolean
        meta:
          $ref: '#/components/schemas/successResponseDecrypt_meta'
        data:
          items:
            $ref: '#/components/schemas/successResponseDecrypt_data_inner'
          type: array
      type: object
    successResponseCheckJwtExpiry:
      example:
        data:
        - jwtToken: eyJhbGciOi...
        - jwtToken: eyJhbGciOi...
        success: true
        meta:
          code: 200
          message: Jwt-Token expiry check successfully
      properties:
        success:
          example: true
          type: boolean
        meta:
          $ref: '#/components/schemas/successResponseCheckJwtExpiry_meta'
        data:
          items:
            $ref: '#/components/schemas/successResponseCheckJwtExpiry_data_inner'
          type: array
      type: object
    successResponseHash:
      example:
        data:
        - payloadHash: eyJhbGciOi...
        - payloadHash: eyJhbGciOi...
        success: true
        meta:
          code: 200
          message: Payload-hash created successfully
      properties:
        success:
          example: true
          type: boolean
        meta:
          $ref: '#/components/schemas/successResponseHash_meta'
        data:
          items:
            $ref: '#/components/schemas/successResponseHash_data_inner'
          type: array
      type: object
    successResponseVerifyJwt:
      example:
        data:
        - jwtToken: eyJhbGciOi...
        - jwtToken: eyJhbGciOi...
        success: true
        meta:
          code: 200
          message: jwtToken verify successfully
      properties:
        success:
          example: true
          type: boolean
        meta:
          $ref: '#/components/schemas/successResponseVerifyJwt_meta'
        data:
          items:
            $ref: '#/components/schemas/successResponseCheckJwtExpiry_data_inner'
          type: array
      type: object
    successResponseConfig:
      example:
        data:
        - schemaVersion: 1.0.0
          targetEntity: kyriba-to-deutsche-bank
          targetEntityType: post-pipeline-accounting-data-expi
          schemaId: "65"
          schemaProvider: Starfish Aggregator
          schemaType: inputSanitizationSchema
          schemaMetaData:
            clientPath: /banking/transactions/v2
            basePath: /gw/dbapi
            host: simulator-api.db.com
            accountPath: /banking/cashAccounts/v2/
            clientConfing:
